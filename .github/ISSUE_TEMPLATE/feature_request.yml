name: Feature Request
description: Suggest a new feature or enhancement
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea to improve Neuronapixel!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the feature
      placeholder: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature important?
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How would you like to see this implemented?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered

