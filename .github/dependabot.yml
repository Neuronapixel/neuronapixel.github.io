version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - deps
      - chore
    commit-message:
      prefix: chore
      include: scope
    rebase-strategy: auto
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
