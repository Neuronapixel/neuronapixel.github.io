<!DOCTYPE html>
<html>
  <head>

    <meta charset="utf-8">
    <title>Neuronapixel</title>
    <meta name="description" content="Desarrollo Web y creatividad, la multimedia como lenguaje de bastas interpretaciones en la que cada experiencia es un mensaje diferente. 
    Neuronapixel cree en el valor implícito de la interacción como vehiculo para el transito de las ideas."/>
    <meta http-equiv="description" content="Desarrollo Web y creatividad, la multimedia como lenguaje de bastas interpretaciones en la que cada experiencia es un mensaje diferente.

    <meta name="keywords" content="multimedia,creatividad,interactivos,web,programacion,flash,php,javascript,webapps,cdm,click,interactividad,facebook,kinbit,neurona,pixel,inteligencia artificial,inteligencia, luis, venegas, cacho, cultura de monitor"/>
    <meta name="keywords" http-equiv="multimedia,creatividad,programacion,interactivos,web,flash,php,javascript,webapps,cdm,click,interactividad,facebook,kinbit,neurona,pixel,inteligencia artificial,inteligencia, luis, venegas, cacho, cultura de monitor"/>
    <script src="https://aframe.io/releases/0.3.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-template-component@3.x.x/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@3.x.x/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@3.x.x/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@^3.2.0/dist/aframe-animation-component.min.js"></script>
    <script src="../components/set-image.js"></script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56ZCJDF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
     <a-scene>
      <a-assets>

        <img id="city" crossorigin="anonymous" src="world/stage1.jpg">
        <img id="cubes" crossorigin="anonymous" src="world/stage2.jpg">
        <img id="sechelt" crossorigin="anonymous" src="world/stage3.jpg">

        <script id="neuron" type="text/html">
          <a-entity class="neuron"
            geometry="primitive: box; width: 1; height: 1; depth: 1"
            material="color:#f00">
          </a-entity>
        </script>
        <script id="beacon" type="text/html">
            <a-entity class="beacon"
              scale="0.5 0.5 0.5" 
              set-image="on: click; target: #image-360; src: ${src}">
              <a-entity 
                template="src: #neuron"
              ></a-entity>
            </a-entity>
        </script>
      </a-assets>
       <a-entity>
        <a-entity position="0 1 5" template="src: #beacon" data-src="#cubes" ></a-entity>
        <a-entity position="5 1 0" template="src: #beacon" data-src="#city" ></a-entity>
        <a-entity position="0 1 -5" template="src: #beacon" data-src="#sechelt" ></a-entity>
      </a-entity>
      <a-sky id="image-360" src="#city"></a-sky>
       <!-- Camera + cursor. -->
      <a-entity id="mainCamera" position="-5 0 0">
        <a-entity camera look-controls position="0 1 0" rotation="0 -90 0">
          <a-cursor id="cursor"
            color="black"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            animation__fusing="property: scale; startEvents: fusing; from: 1.0 1.0 1.0; to: 0.1 0.1 0.1; dur: 1500; easing: easeInBack"
            event-set__1="_event: mouseenter; color: springgreen"
            event-set__2="_event: mouseleave; color: black"
            raycaster="objects: .beacon">
          </a-cursor>
        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
